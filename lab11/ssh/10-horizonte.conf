# /etc/ssh/sshd_config.d/10-horizonte.conf — SSH endurecido del servidor del colegio
# Se carga ANTES que el resto de sshd_config: en sshd GANA LA PRIMERA aparición de cada opción.
# Comentarios SIEMPRE en su propia línea: en ForceCommand o Banner, un '# …' al final pasa a ser parte del valor.

# ¿Quién entra y cómo?
# nadie entra como root: se entra con su usuario y se usa sudo
PermitRootLogin no
# solo claves (las contraseñas se adivinan; las claves ed25519 no)
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# solo estos grupos pueden usar SSH
AllowGroups sshadmins sftp-web
MaxAuthTries 3
LoginGraceTime 20
# frena avalanchas de conexiones sin autenticar
MaxStartups 10:30:60

# Sesiones
ClientAliveInterval 300
# corta sesiones colgadas a los 10 minutos
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no

# Criptografía moderna (OpenSSH 9.6): post-cuántico híbrido primero
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# Registro y aviso legal
# registra la huella de la clave con la que entró cada usuario
LogLevel VERBOSE
# solo ASCII: ssh muestra escapados los caracteres acentuados
Banner /etc/issue.net

# El equipo de comunicación: solo SFTP, encerrado en /srv/horizonte, sin terminal ni túneles
# (Match va SIEMPRE al final: todo lo que sigue aplica solo a ese grupo)
Match Group sftp-web
    ChrootDirectory /srv/horizonte
    ForceCommand internal-sftp -d /www -u 0002
    AllowTcpForwarding no
    PermitTTY no